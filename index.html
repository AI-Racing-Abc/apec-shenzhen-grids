<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APEC Shenzhen Grids</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #122A3A; color: #FAF4E6; padding: 24px 16px 48px; }
    h1 { font-size: 1.35rem; font-weight: 650; text-align: center; margin: 0 0 8px; }
    p { text-align: center; color: #D6C496; margin: 0 0 24px; font-size: .95rem; }
    figure { margin: 0 0 28px; background: #F5F0E6; border-radius: 16px; padding: 12px; }
    img { width: 100%; height: auto; display: block; border-radius: 8px; }
    figcaption { color: #122A3A; text-align: center; padding: 10px 4px 2px; font-size: .95rem; }
    a { color: #122A3A; }
  </style>
</head>
<body>
  <h1>APEC Shenzhen Meeting Grids</h1>
  <p>Tap and hold each image to save it to your album.</p>
  <figure>
    <a href="apec-folk-songs-9grid.png">
      <img src="apec-folk-songs-9grid.png" alt="3x3 grid of 21 APEC folk songs">
    </a>
    <figcaption>Folk songs of the 21 APEC economies</figcaption>
  </figure>
  <figure>
    <a href="apec-major-ports-9grid.png">
      <img src="apec-major-ports-9grid.png" alt="3x3 grid of 21 APEC major ports">
    </a>
    <figcaption>Major ports of the 21 APEC economies</figcaption>
  </figure>
</body>
</html>
